[pytest]
# 测试路径配置
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 异步测试配置
asyncio_mode = auto

# 默认命令行选项
addopts = 
    --strict-markers
    --strict-config
    -v
    --tb=short
    --cov=nagaagent
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --cov-fail-under=100

# 测试标记定义
markers = 
    slow: 标记为慢速测试（使用 '-m "not slow"' 排除）
    integration: 集成测试
    unit: 单元测试
    e2e: 端到端测试
    gui: GUI测试（需要图形界面）
    network: 需要网络连接的测试
    mqtt: MQTT相关测试
    voice: 语音相关测试
    game: 游戏系统测试

# 测试过滤
# 默认排除需要外部服务的测试
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 测试超时配置（单位：秒）
timeout = 30
timeout_method = thread